name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        run: make check comparator-test m1-gate-test node-gate-test fuzz-test
      - name: Fetch and verify the upstream pin
        run: make upstream
      - name: Fetch and verify the toolchain pin
        run: make bootstrap
  host-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make conformance test
      - name: Check scoped CLI reads and C7 native cases
        run: node conformance/cli-input-test.mjs
      - name: Compare verify(files, args) with native
        run: node conformance/verify-test.mjs
      - name: Retain redacted Node conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-node
          path: build/conformance-node.json
          if-no-files-found: error
  native-c1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make native-c1
  m1-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make m1-conformance
      - name: Retain redacted M1 conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-m1
          path: build/conformance-m1.json
          if-no-files-found: error
