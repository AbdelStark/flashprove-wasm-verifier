name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        run: make check comparator-test m1-gate-test node-gate-test fuzz-test release-gate-test
      - name: Fetch and verify the upstream pin
        run: make upstream
      - name: Fetch and verify the toolchain pin
        run: make bootstrap
  host-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make conformance test
      - name: Check scoped CLI reads and C7 native cases
        run: node conformance/cli-input-test.mjs
      - name: Compare verify(files, args) with native
        run: node conformance/verify-test.mjs
      - name: Check caller acceptance on the pinned examples
        run: node conformance/acceptance-test.mjs
      - name: Verify published proofs in Chromium through the dedicated worker
        run: npx playwright install --with-deps chromium && node conformance/browser-test.mjs
      - name: Verify both examples in the offline demo by keyboard
        run: node scripts/build-demo.mjs && node conformance/demo-test.mjs
      - name: Retain redacted Node conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-node
          path: build/conformance-node.json
          if-no-files-found: error
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Pack the archive and smoke-test Node, Deno and Bun
        run: make package && REQUIRE_RUNTIMES=1 node conformance/package-test.mjs
      - name: Retain the archive and inventory
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            build/*.tgz
            build/package-inventory.json
          if-no-files-found: error
  repro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the module in two clean roots and compare bytes
        run: make repro
      - name: Retain the reproducibility record
        uses: actions/upload-artifact@v4
        with:
          name: repro
          path: build/repro.json
          if-no-files-found: error
  native-c1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make native-c1
  m1-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make m1-conformance
      - name: Run every published whole call in the Wasmtime host against native
        run: make wasmtime-whole
      - name: Retain redacted M1 conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-m1
          path: |
            build/conformance-m1.json
            build/conformance-wasmtime.json
          if-no-files-found: error
