name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Repository checks
        run: make check
      - name: Fetch and verify the upstream pin
        run: make upstream
      - name: Fetch and verify the toolchain pin
        run: make bootstrap
  native-c1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make native-c1
      - run: make wasm-build-test wasm-audit-test
