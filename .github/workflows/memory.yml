name: Memory evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/memory.yml
      - conformance/memory.py
      - conformance/memory-wait.c
permissions:
  contents: read
jobs:
  memory-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: make check memory-probe
      - name: Retain the measured envelope
        uses: actions/upload-artifact@v4
        with:
          name: memory-envelope
          path: build/memory/run-*/report.json
          if-no-files-found: error
